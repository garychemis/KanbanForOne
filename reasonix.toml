indows.Media.Imaging;\n\nclass Program {\n    [STAThread]\n    static void Main() {\n        var path = @\"icon\\icon-transparent.ico\";\n        var decoder = BitmapDecoder.Create(new Uri(Path.GetFullPath(path), UriKind.Absolute), BitmapCreateOptions.None, BitmapCacheOption.OnLoad);\n        Console.WriteLine(\"Frames: \" + decoder.Frames.Count);\n        foreach (var f in decoder.Frames) {\n            Console.WriteLine($\"  frame: {f.PixelWidth}x{f.PixelHeight}\");\n        }\n        // 默认 Image 用哪个\n        Console.WriteLine(\"Default frame (Frames[0]): \" + decoder.Frames[0].PixelWidth + \"x\" + decoder.Frames[0].PixelHeight);\n        // 尝试用最大帧\n        var max = decoder.Frames[decoder.Frames.Count-1];\n        Console.WriteLine(\"Largest frame: \" + max.PixelWidth + \"x\" + max.PixelHeight);\n    }\n}\nEOF\necho \"written\"", "Bash=cd \"D:\\coding\\c#\\c#_projects\\KanbanForOne\" && python -c \"from PIL import Image; im=Image.open('icon/icon-transparent.png'); print('PNG size:', im.size, 'mode:', im.mode)\"", "Bash=cd \"D:\\coding\\c#\\c#_projects\\KanbanForOne\" && rg -n \"Image\" --glob '*.xaml' -g '!bin/**' -g '!obj/**' -l . | while read f; do echo \"=== $f ===\"; rg -n \"<Image|Source=\" \"$f\"; done", "Bash=cd \"D:/coding/c#/c#_projects/KanbanForOne\" && find . -name \"*.cs\" -not -path \"./bin/*\" -not -path \"./obj/*\" -not -path \"./.vs/*\" | wc -l && echo \"---files---\" && find . -name \"*.cs\" -not -path \"./bin/*\" -not -path \"./obj/*\" -not -path \"./.vs/*\" -exec wc -l {} + | tail -1", "Bash=cd \"D:/coding/c#/c#_projects/KanbanForOne\" && wc -l $(find . -name \"*.cs\" -not -path \"*/obj/*\" -not -path \"*/bin/*\" -not -path \"*/.git/*\" -not -path \"*Tests*\" ) | sort -rn | head -30"]
