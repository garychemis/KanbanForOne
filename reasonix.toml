ef cls(c):\n    r,g,b = c\n    if r<40 and g<40 and b<40: return 'K'\n    if r>240 and g>240 and b>230: return 'W'\n    if r>150 and g>180 and b<120: return 'Y'\n    return 'O'\nfor gy in range(32):\n    row=''\n    for gx in range(32):\n        x = min(w-1, int((gx+0.5)*w/32)); y = min(h-1, int((gy+0.5)*h/32))\n        row += cls(px[x,y])\n    print(f'{gy:2d} {row}')\n\"", "Bash=cd \"D:\\coding\\c#\\c#_projects\\KanbanForOne\" && python -c \"\nfrom PIL import Image\nfrom collections import Counter\nim = Image.open('icon/icon3.png').convert('RGB')\nw,h = im.size\npx = im.load()\n# 统计内部区域（避开四角黑色）的颜色分布\ncnt = Counter()\ndark_inner = []\nfor y in range(300, 954, 3):\n    for x in range(300, 954, 3):\n        c = px[x,y]\n        cnt[c] += 1\n        if max(c) < 100: dark_inner.append((x,y,c))\nprint('top colors:', cnt.most_common(8))\nprint('dark inner pixels:', len(dark_inner), dark_inner[:10])\n# 卡片边缘附近颜色（过渡带）\nprint('edge samples:')\nfor name,(x,y) in {'内移10px四角':(200,200),'外移10px(黑区)':(5,5),'过渡(边界)':(160,160)}.items():\n    print(name, px[x,y])\n\"", "Bash=cd \"D:\\coding\\c#\\c#_projects\\KanbanForOne\" && python -c \"\nfrom PIL import Image, ImageChops\nimport os\nim = Image.open('icon/icon3.png').convert('RGB')\nr,g,b = im.split()\nalpha = ImageChops.lighter(ImageChops.lighter(r,g), b)\nout = Image.merge('RGBA',(r,g,b,alpha))\nw,h = out.size\npx = out.load()\nprint('size', w, h)\n# 关键点 alpha 检查\nfor name,(x,y) in {'黑角(5,5)':(5,5),'黑角(60,60)':(60,60),'卡片白(center)':(w//2,200),'蓝logo':(w//2,300),'黄绿':(w//2,600),'圆角过渡(160,160)':(160,160)}.items():\n    print(name, px[x,y])\n# 统计 alpha 分布\nfrom collections import Counter\nc = Counter()\nfor y in range(0,h,5):\n    for x in range(0,w,5):\n        c[px[x,y][3]//16] += 1\nprint('alpha buckets (0=transparent..15=opaque):', dict(sorted(c.items())))\n\"", "Bash=cd \"D:\\coding\\c#\\c#_projects\\KanbanForOne\" && python -c \"\nfrom PIL import Image\npng = Image.open('icon/icon-transparent.png')\nprint('PNG:', png.format, pn